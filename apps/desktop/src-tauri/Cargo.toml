[package]
name = "smara-desktop"
version = "0.2.4"
description = "Smara's lightweight local executor companion"
authors = ["Syntarus"]
edition = "2021"
autobins = false

[[bin]]
name = "smara-desktop"
path = "src/native_main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2.8", features = [] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
