[package]
name = "smara-desktop"
version = "0.1.0"
description = "Smara's lightweight local executor companion"
authors = ["Syntarus"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
futures-util = "0.3"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
