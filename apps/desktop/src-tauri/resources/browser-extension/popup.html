<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #1f2328; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .ok { color: #1a7f37; } .off { color: #9a6700; }
  button { margin-top: 8px; width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }

  <h1>Smara</h1>
  <p id="state">Checking…</p>
  <p id="tabs"></p>

  <button id="pause">Pause Smara in this browser</button>
