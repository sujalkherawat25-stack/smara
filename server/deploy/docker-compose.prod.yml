# Production stack on the Oracle host, next to MemoryOS.
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
# Caddy routes https://ai.syntarus.com/smara/* (and the older /munim/* alias for old Desktop builds) -> 127.0.0.1:8090 (prefix stripped).
name: smara

services:
  smara_postgres:
    image: postgres:16-alpine
    container_name: smara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smara
      POSTGRES_PASSWORD: ${SMARA_DB_PASSWORD:?set SMARA_DB_PASSWORD in .env}
      POSTGRES_DB: smara
    volumes:
      - smara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smara"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [smara]

  smara_app:
    build: ..
    image: smara-app:${SMARA_VERSION:-local}
    container_name: smara_app
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://smara:${SMARA_DB_PASSWORD}@smara_postgres:5432/smara
      # Continuum over the docker network, no public round trip
      CONTINUUM_URL: http://memoryos_backend:8000/v1
      PUBLIC_BASE_URL: https://ai.syntarus.com/smara
      SANDBOX_MODE: container
      SANDBOX_JOBS_DIR: /jobs
      VAULT_MASTER_KEY_FILE: /run/secrets/vault_master_key
      # A shop's own SIM through the Baileys sidecar (unofficial). Switched OFF: WhatsApp restricted the linked
      # device on 2026-11-11, so the owner's messages use Telegram. To switch it back on, set this to
      # http://smara_wa_link:8090 and start the sidecar with COMPOSE_PROFILES=wa-link (see release.sh).
      WA_LINK_URL: ""
      WA_LINK_TOKEN_FILE: /run/secrets/wa_link_token
      # Each shop's server browser keeps its cookies here between chats (like a person's own browser profile)
      BROWSER_PROFILE_ROOT: /data/browser-profiles
    secrets:
      - vault_master_key
      - wa_link_token
    volumes:
      - smara_jobs:/jobs
      - smara_browser:/data/browser-profiles
      # Files the owner sends (kept 7 days). A named volume keeps them across releases.
      - smara_owner_files:/app/data/owner-files
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      smara_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [smara, smara_link, memoryos_default]

  # Baileys sidecar for shops' own WhatsApp numbers (unofficial; see server/wa_link/README.md). It is reachable only
  # from smara_app on smara_link: no published port, no database access, no files written, credentials in memory only.
  smara_wa_link:
    profiles: ["wa-link"]     # off by default; release.sh starts it only when COMPOSE_PROFILES=wa-link
    build:
      context: ../wa_link
    image: smara-wa-link:${SMARA_VERSION:-local}
    container_name: smara_wa_link
    restart: unless-stopped
    environment:
      WA_LINK_CALLBACK_URL: http://smara_app:8080/internal/wa-link
      WA_LINK_TOKEN_FILE: /run/secrets/wa_link_token
    secrets:
      - wa_link_token
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [smara_link]

  # Runs the agent's Python on uploaded files. No network at all, read-only root,
  # tmpfs scratch, capped memory/CPU/pids; jobs run as `nobody` (see sandbox/runner.py).
  smara_sandbox:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    image: smara-sandbox:${SMARA_VERSION:-local}
    container_name: smara_sandbox
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - smara_jobs:/jobs
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]   # runner only; jobs run as nobody with no caps
    security_opt:
      - no-new-privileges:true

networks:
  smara: {}
  smara_link: {}
  memoryos_default:
    external: true

# The vault master key lives only in this file on the host (never in .env, git or the image).
secrets:
  vault_master_key:
    file: ../secrets/vault_master_key
  wa_link_token:
    file: ../secrets/wa_link_token

# Named volumes keep their exact names (no project prefix). The rename copied the data from the old munim_munim_* volumes.
volumes:
  smara_pgdata:
    name: smara_pgdata
  smara_jobs:
    name: smara_jobs
  smara_browser:
    name: smara_browser
  smara_owner_files:
    name: smara_owner_files
