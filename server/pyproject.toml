[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smara-server"
version = "0.0.1"
description = "Smara - WhatsApp-native MSME collections agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.2,<4",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0.1,<3",
  "pypdf>=5,<7",
  "playwright>=1.55,<2",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "python-docx>=1.1,<2", "pytest-asyncio>=0.24,<1", "pandas>=2.2,<4", "reportlab>=4.2,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
