services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["smara-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smara
      POSTGRES_USER: smara
      POSTGRES_PASSWORD: ${SMARA_POSTGRES_PASSWORD:?set SMARA_POSTGRES_PASSWORD in .env}
    volumes: ["smara-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smara -d smara"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["uvicorn", "smara.api:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      SMARA_REDIS_URL: ${SMARA_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A host-local port keeps the API private; Caddy is the only public entry.
    # Staging uses SMARA_HOST_PORT=8090 so it cannot collide with live Smara.
    ports: ["${SMARA_BIND_ADDRESS:-127.0.0.1}:${SMARA_HOST_PORT:-8080}:8080"]
    volumes: ["smara-data:/app/data"]
  # Canonical Smara UI. Caddy serves this container at the ai.syntarus.com root.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SMARA_MODE: ${VITE_SMARA_MODE:-true}
        VITE_SMARA_API_URL: ${VITE_SMARA_API_URL:-/smara-api}
        VITE_SMARA_CONTROL_TOKEN_PATH: ${VITE_SMARA_CONTROL_TOKEN_PATH:-/v1/auth/control-token}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports: ["${SMARA_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${SMARA_FRONTEND_HOST_PORT:-8081}:80"]
    depends_on:
      api:
        condition: service_started
  worker:
    build: .
    command: ["python", "-m", "smara.worker"]
    env_file: .env
    environment:
      SMARA_REDIS_URL: ${SMARA_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: ["smara-data:/app/data"]
  scheduler:
    build: .
    command: ["python", "-m", "smara.scheduler"]
    env_file: .env
    environment:
      SMARA_REDIS_URL: ${SMARA_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: ["smara-data:/app/data"]
  integration-worker:
    build: .
    command: ["python", "-m", "smara.integration_worker"]
    env_file: .env
    environment:
      SMARA_REDIS_URL: ${SMARA_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: ["smara-data:/app/data"]
volumes:
  smara-data:
  smara-postgres:
  smara-redis:
