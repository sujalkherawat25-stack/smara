services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smara
      POSTGRES_USER: smara
      POSTGRES_PASSWORD: ${SMARA_POSTGRES_PASSWORD:?set SMARA_POSTGRES_PASSWORD in .env}
    volumes: ["smara-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smara -d smara"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["uvicorn", "smara.api:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["smara-data:/app/data"]
  worker:
    build: .
    command: ["python", "-m", "smara.worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["smara-data:/app/data"]
  scheduler:
    build: .
    command: ["python", "-m", "smara.scheduler"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["smara-data:/app/data"]
volumes:
  smara-data:
  smara-postgres:
