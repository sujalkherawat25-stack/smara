[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smara"
version = "0.1.0"
description = "Smara independent agent control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
  "python-multipart>=0.0.9,<1",
  "pywebpush>=2.0,<3",
  "sentry-sdk>=2.0,<3",
  "redis>=5.0,<6",
  "PyJWT>=2.8,<3",
  "syntarus>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
smara = "smara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
