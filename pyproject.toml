[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smara"
version = "0.1.0"
description = "Smara independent agent control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
  "python-multipart>=0.0.9,<1",
  "pywebpush>=2.0,<3",
  "sentry-sdk>=2.0,<3",
  "redis>=5.0,<6",
  "PyJWT>=2.8,<3",
  "google-auth>=2.28,<3",
  "syntarus>=0.2.0",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
test-eval = ["datasets>=3,<4", "pytest>=8,<9"]

[project.scripts]
smara = "smara.cli:main"
smara-desktop = "smara.desktop_executor:main"
smara-migrate = "smara.migrations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
