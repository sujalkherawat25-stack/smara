[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smara-munim"
version = "0.0.1"
description = "Smara Digital Munim - WhatsApp-native MSME collections agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.2,<4",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "pandas>=2.2,<4", "reportlab>=4.2,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
