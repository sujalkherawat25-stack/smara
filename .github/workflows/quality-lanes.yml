name: Runtime quality lanes
on: [push, pull_request]
permissions:
  contents: read

jobs:
  native-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Native runtime, providers, tools and settings contracts
        run: >-
          python -m pytest -q
          tests/test_native_cli.py tests/test_native_auth.py
          tests/test_native_profiles.py tests/test_native_management.py
          tests/test_native_provider.py tests/test_native_search.py
          tests/test_native_tools.py tests/test_native_schedule.py
          tests/test_own_harness_routing.py

  legacy-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Legacy compatibility and fail-closed execution checks
        run: >-
          python -m pytest -q
          tests/test_legacy_execution_safety.py tests/test_tool_registry.py
          tests/test_autonomous_tools_surgical.py tests/test_desktop_executor.py

  browser-and-worker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,browser]"
      - name: Browser controls, worker isolation and Docker sandbox contracts
        run: >-
          python -m pytest -q
          tests/test_native_browser.py tests/test_h5_managed_browser.py
          tests/test_worker_snapshot_review.py tests/test_h6_bounded_delegation.py
          tests/test_docker_workspace_sandbox.py

  research-quality-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Deterministic research and evidence checks (no live model calls)
        run: >-
          python -m pytest -q
          tests/test_deep_research_evidence.py tests/test_research_completeness.py
          tests/test_research_clock_and_review_budget.py tests/test_research_sources.py

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm test
      - working-directory: apps/desktop
        run: npm run build

  web-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run type-check
      - working-directory: frontend
        run: npm run build

  distributable-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build wheel and reject legacy execution modules
        shell: bash
        run: |
          python -m pip wheel . --no-deps -w build/wheel
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("build/wheel/*.whl")
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          forbidden = {
              "smara/agent_tools.py", "smara/autonomous_agent.py", "smara/cli.py",
              "smara/desktop_executor.py", "smara/local_agent_runtime.py",
              "smara/self_healing.py", "smara/swarm.py", "smara/tool_synthesis.py",
          }
          leaked = sorted(forbidden & names)
          assert not leaked, f"legacy execution modules leaked into wheel: {leaked}"
          assert "smara/native_runtime.py" in names, "native runtime missing from wheel"
          PY
