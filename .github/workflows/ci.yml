name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: munim
          POSTGRES_PASSWORD: munim
          POSTGRES_DB: munim
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U munim"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://munim:munim@localhost:5433/munim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python -m evals.run_claims
