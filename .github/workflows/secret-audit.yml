name: Redacted secret audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Scan history and current source without exposing values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          python -m scripts.audit_repository_secrets --verify-upstream --gate --report build/secret-audit.json
