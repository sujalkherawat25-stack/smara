name: Server CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smara
          POSTGRES_PASSWORD: smara
          POSTGRES_DB: smara
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U smara"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smara:smara@localhost:5433/smara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[test]"
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python -m evals.run_claims

  wa-link:
    # The Baileys sidecar for a shop's own WhatsApp number (server/wa_link): unit tests, and the image must build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        working-directory: server/wa_link
        run: npm ci --no-audit --no-fund
      - name: Unit tests (fake WhatsApp, no network)
        working-directory: server/wa_link
        run: npm test
      - name: Build the image
        working-directory: server/wa_link
        run: docker build -t smara-wa-link:ci .
